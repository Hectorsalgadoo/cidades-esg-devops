version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esg_api_app
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-Development}
      - DB_USER=${DB_USER:-esg_user}
      - DB_PASSWORD=${DB_PASSWORD:-esg_password_segura}
      - DB_NAME=${DB_NAME:-esg_db}
    depends_on:
      - db
    networks:
      - esg_network

  db:
    image: postgres:15-alpine
    container_name: esg_db
    environment:
      POSTGRES_USER: ${DB_USER:-esg_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-esg_password_segura}
      POSTGRES_DB: ${DB_NAME:-esg_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - esg_network

networks:
  esg_network:
    driver: bridge

volumes:
  postgres_data: